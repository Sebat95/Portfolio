<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070B18" />
      <stop offset="1" stop-color="#02030A" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.55" />
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)" />

  <!-- Brand icon -->
  <image
    href="icon.png"
    x="100"
    y="175"
    width="280"
    height="280"
    preserveAspectRatio="xMidYMid meet"
  />

  <!-- Text -->
  <g transform="translate(420 250)">
    <text x="0" y="0" fill="#FFFFFF" font-family="system-ui, -apple-system, Segoe UI, Inter, Arial, sans-serif" font-size="64" font-weight="700">
      Samuele Battaglino
    </text>
    <text x="0" y="64" fill="#B8C1D9" font-family="system-ui, -apple-system, Segoe UI, Inter, Arial, sans-serif" font-size="30" font-weight="500">
      Full-Stack Engineer
    </text>
  </g>
</svg>
